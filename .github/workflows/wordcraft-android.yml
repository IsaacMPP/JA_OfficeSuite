name: JA OfficeSuite - WordCraft Android integration
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    env:
      ANDROID_ABIS: arm64-v8a
    steps:
      - name: Checkout pinned WordCraft Android
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;29.0.14206865"
          yes | sdkmanager --licenses >/dev/null || true
      - name: Build upstream APK (arm64)
        working-directory: upstream/wordcraft-android/apps/wordcraft-android/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JA-OfficeSuite-WordCraft-upstream-arm64-debug
          path: upstream/wordcraft-android/apps/wordcraft-android/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
